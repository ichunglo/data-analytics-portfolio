<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="650" viewBox="0 0 1400 650" role="img" aria-labelledby="title desc">
<title id="title">Drug-target landscape data pipeline architecture</title><desc id="desc">Source snapshots and supporting evidence flow through identity reconciliation into an audited SQLite database, followed by SQL and Python analysis and published outputs.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#739693"/></marker><style>text{font-family:Arial,sans-serif;fill:#173740}.title{font-size:32px;font-weight:700}.subtitle{font-size:17px;fill:#5b7377}.stage{font-size:14px;font-weight:700;letter-spacing:2px;fill:#207274}.heading{font-size:21px;font-weight:700}.body{font-size:16px;fill:#526d72}.small{font-size:14px;fill:#526d72}.connector{stroke:#739693;stroke-width:3;fill:none;marker-end:url(#arrow)}</style></defs>
<rect width="1400" height="650" rx="20" fill="#f5f9f7"/>
<text x="60" y="65" class="title">Drug–target landscape · data pipeline</text><text x="60" y="96" class="subtitle">A source-aware path from research data to a portfolio dashboard</text>
<text x="60" y="158" class="stage">01 · COLLECT</text><text x="405" y="158" class="stage">02 · RECONCILE</text><text x="750" y="158" class="stage">03 · ANALYZE</text><text x="1095" y="158" class="stage">04 · COMMUNICATE</text>
<rect x="60" y="180" width="265" height="267" rx="12" fill="#fff" stroke="#d8e7e2"/><text x="82" y="218" class="heading">Source evidence</text><text x="82" y="254" class="body">Paper supplements</text><text x="82" y="285" class="body">TTD snapshots</text><text x="82" y="316" class="body">ClinicalTrials.gov</text><text x="82" y="347" class="body">FDA and UniProt</text><text x="82" y="389" class="small">Different dates, scopes,</text><text x="82" y="410" class="small">and levels of completeness</text>
<rect x="405" y="180" width="265" height="267" rx="12" fill="#fff" stroke="#d8e7e2"/><text x="427" y="218" class="heading">Curation + database</text><text x="427" y="254" class="body">Resolve identities</text><text x="427" y="285" class="body">Link drugs and targets</text><text x="427" y="316" class="body">Retain source evidence</text><text x="427" y="347" class="body">Check data integrity</text><rect x="427" y="377" width="221" height="42" rx="6" fill="#e5f1ed"/><text x="440" y="404" class="body">Audited SQLite snapshot</text>
<rect x="750" y="180" width="265" height="267" rx="12" fill="#fff" stroke="#d8e7e2"/><text x="772" y="218" class="heading">SQL + Python</text><text x="772" y="254" class="body">Select evidence view</text><text x="772" y="285" class="body">Count distinct records</text><text x="772" y="316" class="body">Validate and summarize</text><text x="772" y="347" class="body">Generate figures</text><text x="772" y="389" class="small">Snapshot hash and</text><text x="772" y="410" class="small">reproducible demo</text>
<rect x="1095" y="180" width="245" height="267" rx="12" fill="#173d43"/><text x="1117" y="218" class="heading" style="fill:white">Published outputs</text><text x="1117" y="258" class="body" style="fill:#d7eae5">Portfolio + results</text><text x="1117" y="293" class="body" style="fill:#d7eae5">Interactive dashboard</text><text x="1117" y="328" class="body" style="fill:#d7eae5">Full blog explorer</text><text x="1117" y="380" class="small" style="fill:#b7d2cd">Aggregate results only;</text><text x="1117" y="402" class="small" style="fill:#b7d2cd">source databases stay local</text>
<path d="M 326 313 H 393" class="connector"/><path d="M 671 313 H 738" class="connector"/><path d="M 1016 313 H 1083" class="connector"/>
<rect x="60" y="495" width="1280" height="93" rx="10" fill="#e5f1ed"/><text x="82" y="530" class="heading" style="font-size:18px">Interpretation follows the evidence</text><text x="82" y="559" class="body">Source-reported approval can be non-US; missing approval is not proof of failure. The sources are not a complete matched cohort.</text>
</svg>
